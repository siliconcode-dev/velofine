name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

  package-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: ./gradlew :installer:jpackageAppImage :installer:innoSetupCompile

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: Velofine-Setup
          path: installer/build/innosetup/Velofine-Setup.exe
          if-no-files-found: error

      # diagnostic.exe (v1.5 Phase 1) - a standalone tool, built and uploaded separately from the
      # main installer since it must run correctly on a machine that has never installed Velofine.
      - name: Build diagnostics-tool
        run: ./gradlew :diagnostics-tool:jpackageAppImage :diagnostics-tool:zipDistribution

      - name: Upload diagnostics-tool artifact
        uses: actions/upload-artifact@v5
        with:
          name: VelofineDiagnostic
          path: diagnostics-tool/build/dist/VelofineDiagnostic-*-win64.zip
          if-no-files-found: error
